frr version 10.2.1_git
frr defaults traditional
hostname r3
domainname localdomain
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth1
 ip address 10.2.34.1/30
 ip ospf area 0
exit
!
interface eth2
 ip address 172.16.0.2/30
exit
!
interface lo
 ip address 3.3.3.3/32
 ip ospf area 0
exit
!
router bgp 65002
 bgp router-id 3.3.3.3
 no bgp ebgp-requires-policy
 neighbor 172.16.0.1 remote-as 65001
 !
 address-family ipv4 unicast
  network 3.3.3.3/32
  network 4.4.4.4/32
  network 192.168.2.0/24
  network 10.2.34.0/30
 exit-address-family
exit
!
router ospf
 ospf router-id 3.3.3.3
 redistribute bgp
exit
!
