frr version 10.2.1_git
frr defaults traditional
hostname r4
domainname localdomain
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth1
 ip address 10.2.34.2/30
 ip ospf area 0
exit
!
interface eth2
 ip address 192.168.2.1/24
 ip ospf area 0
 ip ospf passive
exit
!
interface lo
 ip address 4.4.4.4/32
 ip ospf area 0
exit
!
router ospf
 ospf router-id 4.4.4.4
exit
!
