frr version 10.2.1_git
frr defaults traditional
hostname r2
domainname localdomain
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth1
 ip address 10.1.12.2/30
 ip ospf area 0
exit
!
interface eth2
 ip address 192.168.1.1/24
 ip ospf area 0
 ip ospf passive
exit
!
interface lo
 ip address 2.2.2.2/32
 ip ospf area 0
exit
!
router ospf
 ospf router-id 2.2.2.2
exit
!
